services:
    postgres:
        image: postgres:16-alpine
        container_name: leb-db
        environment:
            POSTGRES_USER: leb
            POSTGRES_PASSWORD: leb
            POSTGRES_DB: leb
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data

    adminer:
        image: adminer:latest
        container_name: leb-adminer
        restart: unless-stopped
        ports:
            - '8080:8080'
        depends_on:
            - postgres

    portainer:
        image: portainer/portainer-ce:latest
        container_name: leb-portainer
        restart: unless-stopped
        ports:
            - '9000:9000'
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - portainer_data:/data

    minio:
        image: minio/minio:latest
        container_name: leb-minio
        command: server /data --console-address ":9101"
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin123
        ports:
            - '9100:9000'
            - '9101:9101'
        volumes:
            - minio_data:/data
        restart: unless-stopped

volumes:
    postgres_data:
    portainer_data:
    minio_data:
